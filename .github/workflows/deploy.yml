name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t runagen-app:latest .

      - name: Save Docker Image as Tarball
        run: |
          docker save runagen-app:latest | gzip > runagen-app.tar.gz

      - name: Copy Configurations to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx.conf,web,runagen-app.tar.gz"
          target: "~/runagen-app"

      - name: Execute Remote Deploy Commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/runagen-app
            gunzip -c runagen-app.tar.gz | docker load
            rm runagen-app.tar.gz
            docker compose up -d
